<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="440" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">Ein vorbereiteter Ordner, zwei Lektionen mit dem Agenten</text><rect x="30" y="70" width="330" height="280" rx="12" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><path d="M177,104 L189,104 L193,109 L213,109 L213,130 L177,130 Z" stroke="#18181b" stroke-width="2" fill="#ffffff"/><text x="195" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">Ihr Projektordner</text><text x="195" y="188" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#52525b" text-anchor="middle" xml:space="preserve">Beispielfall: kundenanfragen</text><text x="195" y="222" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle" xml:space="preserve">eingerichtet im Kurs „Produktiv</text><text x="195" y="243" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle" xml:space="preserve">mit einem Agenten arbeiten“</text><rect x="73.60000000000001" y="296" width="242.79999999999998" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="195.0" y="314" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle" xml:space="preserve">diese Lektion prüft ihn</text><rect x="430" y="70" width="540" height="130" rx="12" fill="#ffffff" stroke="#0052ff" stroke-width="1.5"/><rect x="450" y="101" width="18" height="18" rx="4" fill="#e8efff" stroke="#0052ff" stroke-width="2"/><rect x="475" y="101" width="18" height="18" rx="4" fill="#e8efff" stroke="#0052ff" stroke-width="2"/><rect x="500" y="101" width="18" height="18" rx="4" fill="#e8efff" stroke="#0052ff" stroke-width="2"/><text x="530" y="116" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">n8n mit dem Agenten</text><text x="530" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">Workflow-Datei lesen und als Kopie ändern, die</text><text x="530" y="167" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">Kopie in n8n importieren</text><line x1="364" y1="210" x2="426" y2="135" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="430" y="220" width="540" height="130" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><path d="M466,248 L478,248 L482,253 L502,253 L502,274 L466,274 Z" stroke="#18181b" stroke-width="2" fill="#ffffff"/><text x="530" y="266" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">Starterpaket</text><text x="530" y="296" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">Der Agent legt den neuen Ordner mein-projekt</text><text x="530" y="317" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">an: Regeln, Ablage, zwei Skills, Checkliste.</text><line x1="364" y1="210" x2="426" y2="285" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="376" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="404.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Wer den Selbsttest besteht, macht direkt mit „n8n mit dem Agenten“ weiter.</text></svg>