<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">Eine Anbindung handelt mit den Rechten des n8n-Kontos</text><rect x="30" y="66" width="200" height="76" rx="10" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><text x="130.0" y="109.4" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0052ff" text-anchor="middle" xml:space="preserve">Agent</text><line x1="234" y1="104" x2="300" y2="104" stroke="#52525b" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="304" y="90" width="50.8" height="28" rx="14.0" fill="#e8efff" stroke="#0052ff" stroke-width="1.2"/><text x="329.4" y="108" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle" xml:space="preserve">MCP</text><line x1="380" y1="104" x2="446" y2="104" stroke="#52525b" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="450" y="66" width="520" height="76" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="472" y="96" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">n8n-Konto</text><text x="472" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">Workflows anlegen, ändern, je nach Freischaltung ausführen</text><rect x="30" y="170" width="940" height="92" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="56" y="208" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626" text-anchor="start" xml:space="preserve">✗</text><text x="86" y="208" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">Instanz mit Workflows, die echte Kundendaten verarbeiten</text><text x="86" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">keine Anbindung freischalten</text><rect x="30" y="280" width="940" height="92" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="56" y="318" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#16a34a" text-anchor="start" xml:space="preserve">✓</text><text x="86" y="318" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">Test-Instanz ohne Kundendaten</text><text x="86" y="348" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">Anbindung möglich, im Unternehmen mit Freigabe der IT</text><rect x="30" y="398" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="426.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Exportierte Dateien enthalten die Namen von Zugangsdaten. Vor dem Weitergeben entfernen.</text></svg>