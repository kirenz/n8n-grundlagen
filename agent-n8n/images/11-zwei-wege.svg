<svg xmlns='http://www.w3.org/2000/svg' font-family='Helvetica, Arial, sans-serif' viewBox='0 0 640 230' role='img' aria-label='Zwei Wege. Weg A, im Kurs: Der Agent schreibt die Datei n8n/beispiel-1-datenschutz.json, Sie importieren sie mit Import from File in n8n. Weg B, gestrichelt, nur Hinweis: Der Agent erreicht n8n über einen MCP-Zugang (Zugangskarte) und liest oder legt Workflows direkt an; in n8n heißt die Anbindung Instance-level MCP.' ><defs><marker id='pf' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5b6170'/></marker></defs><text x='20' y='24' font-size='13' font-weight='bold' fill='#23417a' text-anchor='start'>Weg A: im Kurs</text><rect x='20' y='36' width='120' height='56' rx='10' fill='#f4f2ed' stroke='#dcd9d2' stroke-width='1.5'/><text x='80' y='69' font-size='14' font-weight='bold' fill='#1f2430' text-anchor='middle'>Agent</text><line x1='142' y1='64' x2='182' y2='64' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)'/><text x='162' y='56' font-size='10' font-weight='normal' fill='#5b6170' text-anchor='middle'>schreibt</text><rect x='186' y='36' width='190' height='56' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><text x='281' y='60' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='middle' font-family='ui-monospace, Menlo, monospace'>n8n/</text><text x='281' y='78' font-size='10.5' font-weight='normal' fill='#1f2430' text-anchor='middle' font-family='ui-monospace, Menlo, monospace'>beispiel-1-datenschutz.json</text><line x1='378' y1='64' x2='470' y2='64' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)'/><text x='424' y='56' font-size='10' font-weight='normal' fill='#5b6170' text-anchor='middle'>Import from File</text><rect x='474' y='36' width='146' height='56' rx='10' fill='#f4f2ed' stroke='#23417a' stroke-width='1.5'/><text x='547' y='69' font-size='14' font-weight='bold' fill='#1f2430' text-anchor='middle'>n8n</text><text x='20' y='132' font-size='13' font-weight='bold' fill='#5b6170' text-anchor='start'>Weg B: Hinweis, nicht im Kurs</text><rect x='20' y='144' width='120' height='56' rx='10' fill='#f4f2ed' stroke='#dcd9d2' stroke-width='1.5' stroke-dasharray='6 5'/><text x='80' y='177' font-size='14' font-weight='bold' fill='#1f2430' text-anchor='middle'>Agent</text><line x1='142' y1='172' x2='252' y2='172' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)' stroke-dasharray='5 4'/><rect x='254' y='155' width='54' height='34' rx='6' fill='#f4f2ed' stroke='#23417a' stroke-width='2'/><rect x='262' y='165' width='15' height='13' rx='2.5' fill='#23417a' fill-opacity='0.85'/><line x1='262' y1='171.5' x2='277' y2='171.5' stroke='#f4f2ed' stroke-width='1'/><line x1='269.5' y1='165' x2='269.5' y2='178' stroke='#f4f2ed' stroke-width='1'/><line x1='283' y1='168' x2='300' y2='168' stroke='#23417a' stroke-width='2' stroke-linecap='round'/><line x1='283' y1='176' x2='296' y2='176' stroke='#5b6170' stroke-width='2' stroke-linecap='round'/><text x='281' y='216' font-size='12' font-weight='bold' fill='#23417a' text-anchor='middle'>MCP</text><line x1='308' y1='172' x2='470' y2='172' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)' stroke-dasharray='5 4'/><text x='390' y='164' font-size='10' font-weight='normal' fill='#5b6170' text-anchor='middle'>Workflows lesen, anlegen</text><rect x='474' y='144' width='146' height='56' rx='10' fill='#f4f2ed' stroke='#dcd9d2' stroke-width='1.5' stroke-dasharray='6 5'/><text x='547' y='168' font-size='14' font-weight='bold' fill='#1f2430' text-anchor='middle'>n8n</text><text x='547' y='186' font-size='10.5' font-weight='normal' fill='#5b6170' text-anchor='middle'>Instance-level MCP</text></svg>
