<svg xmlns='http://www.w3.org/2000/svg' font-family='Helvetica, Arial, sans-serif' viewBox='0 0 640 230' role='img' aria-label='Zwei Wege. Weg A, im Kurs: Der Agent schreibt die Datei n8n/beispiel-1-datenschutz.json, Sie importieren sie mit Import from File in n8n. Weg B, gestrichelt, nur Hinweis: Der Agent erreicht n8n über eine MCP-Steckdose und liest oder legt Workflows direkt an; in n8n heißt die Anbindung Instance-level MCP.' ><defs><marker id='pf' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5b6170'/></marker></defs><text x='20' y='24' font-size='13' font-weight='bold' fill='#23417a' text-anchor='start'>Weg A: im Kurs</text><rect x='20' y='36' width='120' height='56' rx='10' fill='#f4f2ed' stroke='#dcd9d2' stroke-width='1.5'/><text x='80' y='69' font-size='14' font-weight='bold' fill='#1f2430' text-anchor='middle'>Agent</text><line x1='142' y1='64' x2='182' y2='64' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)'/><text x='162' y='56' font-size='10' font-weight='normal' fill='#5b6170' text-anchor='middle'>schreibt</text><rect x='186' y='36' width='190' height='56' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><text x='281' y='60' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='middle' font-family='ui-monospace, Menlo, monospace'>n8n/</text><text x='281' y='78' font-size='10.5' font-weight='normal' fill='#1f2430' text-anchor='middle' font-family='ui-monospace, Menlo, monospace'>beispiel-1-datenschutz.json</text><line x1='378' y1='64' x2='470' y2='64' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)'/><text x='424' y='56' font-size='10' font-weight='normal' fill='#5b6170' text-anchor='middle'>Import from File</text><rect x='474' y='36' width='146' height='56' rx='10' fill='#f4f2ed' stroke='#23417a' stroke-width='1.5'/><text x='547' y='69' font-size='14' font-weight='bold' fill='#1f2430' text-anchor='middle'>n8n</text><text x='2