<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">Zwei Vergleiche, eine Verknüpfung</text><rect x="175.20000000000005" y="62" width="310.0" height="28" rx="14.0" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/><text x="330.20000000000005" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle" xml:space="preserve">Anliegen ist gleich Beschwerde</text><rect x="505.20000000000005" y="62" width="319.59999999999997" height="28" rx="14.0" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/><text x="665.0" y="80" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="middle" xml:space="preserve">Anliegen ist gleich Datenschutz</text><rect x="30" y="118" width="940" height="110" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="56" y="156" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#dc2626" text-anchor="start" xml:space="preserve">✗</text><text x="86" y="156" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">combinator: and</text><text x="86" y="184" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Beide Vergleiche müssten zugleich zutreffen. Ein Anliegen ist nie beides.</text><text x="86" y="208" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">Keine Anfrage erreicht den Ausgang true.</text><rect x="30" y="246" width="940" height="110" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="56" y="284" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#16a34a" text-anchor="start" xml:space="preserve">✓</text><text x="86" y="284" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">combinator: or</text><text x="86" y="312" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Ein Vergleich genügt.</text><text x="86" y="336" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">Beschwerde und Datenschutz führen zum Ausgang true, alles andere zu false.</text><rect x="30" y="384" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="412.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Der Agent ändert eine Kopie mit neuem Namen. Das Original bleibt daneben liegen.</text><text x="500" y="452" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle" xml:space="preserve">beispiel-1-kontaktanfragen.json bleibt, beispiel-1-datenschutz.json kommt dazu</text></svg>