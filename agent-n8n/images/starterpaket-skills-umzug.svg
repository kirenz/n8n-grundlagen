<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 472" width="1000" height="472"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="472" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">Der erste Auftrag bringt die Skills an ihren Ort</text><rect x="30" y="66" width="360" height="220" rx="12" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1.5"/><text x="52" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">im Paket</text><text x="52" y="126" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">skills/</text><rect x="52" y="146" width="214.64" height="28" rx="14.0" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/><text x="159.32" y="164" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">eingang-einsortieren</text><rect x="52" y="186" width="147.216" height="28" rx="14.0" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.2"/><text x="125.608" y="204" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">wochenbericht</text><text x="52" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">gleich für jedes Werkzeug</text><line x1="394" y1="176" x2="566" y2="176" stroke="#0052ff" stroke-width="2" marker-end="url(#ab)"/><text x="480" y="160" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0052ff" text-anchor="middle" xml:space="preserve">erster Auftrag</text><text x="480" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="middle" xml:space="preserve">aus README.md</text><rect x="570" y="66" width="400" height="220" rx="12" fill="#e8efff" stroke="#0052ff" stroke-width="1.5"/><text x="592" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0052ff" text-anchor="start" xml:space="preserve">Ort, den der Agent nennt</text><text x="592" y="126" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#18181b" text-anchor="start" xml:space="preserve">Beispiel: .agents/skills/</text><rect x="592" y="146" width="214.64" height="28" rx="14.0" fill="#ffffff" stroke="#0052ff" stroke-width="1.2"/><text x="699.3199999999999" y="164" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">eingang-einsortieren</text><rect x="592" y="186" width="147.216" height="28" rx="14.0" fill="#ffffff" stroke="#0052ff" stroke-width="1.2"/><text x="665.608" y="204" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">wochenbericht</text><text x="592" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">je Werkzeug ein anderer Ort</text><rect x="570" y="304" width="400" height="94" rx="12" fill="#ffffff" stroke="#52525b" stroke-width="1.5" stroke-dasharray="6 5"/><text x="592" y="336" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b" text-anchor="start" xml:space="preserve">eigene Anweisungsdatei mit Verweis</text><text x="592" y="360" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">nur wenn der Agent AGENTS.md nicht</text><text x="592" y="380" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#52525b" text-anchor="start" xml:space="preserve">von selbst liest</text><rect x="30" y="414" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="442.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Zu Beginn kennt der Agent nur Name und Beschreibung. Die Schritte holt er bei Bedarf.</text></svg>