="middle" xml:space="preserve">1</text><text x="420" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Zweck in README.md und im ersten Teil der AGENTS.md</text><circle cx="390" cy="208" r="16" fill="#0052ff"/><text x="390" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">2</text><text x="420" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Regel 2 und 3: welche Quellen gelten, welche Daten nicht</text><text x="420" y="235" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">in Dateien gehören</text><circle cx="390" cy="272" r="16" fill="#0052ff"/><text x="390" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">3</text><text x="420" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Ordnernamen, auch in AGENTS.md, UEBERSICHT.md und Skills</text><rect x="30" y="350" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="378.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Danach die Checkliste im neuen Ordner noch einmal abarbeiten.</text></svg>