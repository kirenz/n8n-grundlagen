<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 352" width="1000" height="352"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0052ff"/></marker></defs><rect width="1000" height="352" fill="#ffffff"/><text x="500" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#18181b" text-anchor="middle" xml:space="preserve">Zehn Prüfpunkte, drei Arten</text><rect x="30" y="66" width="296" height="210" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="50" y="102" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">Auskunft</text><circle cx="66" cy="140" r="16" fill="#0052ff"/><text x="66" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">1</text><circle cx="108" cy="140" r="16" fill="#0052ff"/><text x="108" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">2</text><circle cx="150" cy="140" r="16" fill="#0052ff"/><text x="150" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">4</text><circle cx="192" cy="140" r="16" fill="#0052ff"/><text x="192" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">5</text><circle cx="234" cy="140" r="16" fill="#0052ff"/><text x="234" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">6</text><circle cx="276" cy="140" r="16" fill="#0052ff"/><text x="276" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">10</text><text x="50" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Die Antwort zeigt, ob der</text><text x="50" y="217" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Agent die Dateien kennt.</text><rect x="352" y="66" width="296" height="210" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="372" y="102" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">Datei entsteht</text><circle cx="388" cy="140" r="16" fill="#0052ff"/><text x="388" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">8</text><text x="372" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Ein Entwurf liegt danach in</text><text x="372" y="217" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">antworten/.</text><rect x="674" y="66" width="296" height="210" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="694" y="102" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#18181b" text-anchor="start" xml:space="preserve">Verhalten</text><circle cx="710" cy="140" r="16" fill="#d97706"/><text x="710" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">3</text><circle cx="752" cy="140" r="16" fill="#d97706"/><text x="752" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">7</text><circle cx="794" cy="140" r="16" fill="#d97706"/><text x="794" y="146" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve">9</text><text x="694" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Eine Regel macht das</text><text x="694" y="217" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Verhalten wahrscheinlicher.</text><text x="694" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Ob es eintritt, zeigt erst</text><text x="694" y="259" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">der Test.</text><rect x="30" y="294" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="322.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Die Checkliste lohnt sich bei jedem neuen Vorhaben und bei jedem Wechsel des Agenten.</text></svg>