iesem Kurs</text><rect x="30" y="502" width="940" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="48" y="530.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#18181b" text-anchor="start" xml:space="preserve">Regel 1 bis 7 stammen aus dem Kurs „Produktiv mit einem Agenten arbeiten“.</text></svg>