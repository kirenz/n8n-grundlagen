project:
  type: book
  output-dir: _book
  # Mono-Repo: Slides liegen unter slides/ als eigenständige Reveal.js-Decks
  # mit eigenem Frontmatter und werden NICHT vom Buch-Build erfasst.
  # Auch infra/, workflows/ und scripts/ sind kursbegleitend, kein Buch-Inhalt.
  render:
    - "*.qmd"
    - "bpmn/*.qmd"
    - "overview/*.qmd"
    - "first-workflows/*.qmd"
    - "beispiele/*.qmd"
    # Coding-Agent: Setup steht im eigenen Buch/Kurs „Produktiv mit einem
    # Agenten arbeiten“ (kirenz/agent-arbeitsumgebung); hier nur Brücke + n8n-Fall.
    - "agent-n8n/*.qmd"
  resources:
    - "bpmn/loesung/*"
    - "images/lektionen/*"
    - "images/bpmn/*"
    - "images/beispiele/*"
    - "images/erste-workflows/*"
    - "workflows/beispiele/*"
    - "agent-n8n/images/*"
    - "d2/*.svg"
    - "images/*.png"

lang: de

bibliography: references.bib

execute:
  freeze: auto

book:
  title: "n8n-Grundlagen"
  description: "Von der Plattform zum ersten Workflow"
  author: "Jan Kirenz"

  # Keine Vor/Zurück-Kapitelnavigation am Seitenende: im Plattform-Embed soll
  # über die Plattform navigiert werden, nicht im eingebetteten Buch.
  page-navigation: false

  search:
    type: overlay
  page-footer:
    left: |
      © [Jan Kirenz](https://www.kirenz.com/), 2026

  chapters:
    - index.qmd
    - introduction.qmd

    - part: overview/index.qmd
      chapters:
        - overview/what-is-n8n.qmd
        - overview/pricing.qmd
        - overview/hosting.qmd

    - part: bpmn/index.qmd
      chapters:
        - bpmn/grundelemente.qmd
        - bpmn/gateways.qmd
        - bpmn/ereignisse.qmd
        - bpmn/teilnehmer-und-daten.qmd
        - bpmn/zum-workflow.qmd
        - bpmn/uebung-kulanzantrag.qmd

    - part: first-workflows/index.qmd
      chapters:
        - first-workflows/testzugang.qmd
        - first-workflows/credentials.qmd
        - first-workflows/first-workflow.qmd

    - part: beispiele/index.qmd
      chapters:
        - beispiele/kontaktanfragen.qmd
        - beispiele/rechnung.qmd
        - beispiele/wochenbericht.qmd
        - beispiele/gemini-schluessel.qmd
        - beispiele/gemini.qmd
        - beispiele/rag.qmd

    - part: "Mit einem Coding-Agenten arbeiten"
      chapters:
        - agent-n8n/voraussetzung.qmd
        - agent-n8n/n8n-mit-dem-agenten.qmd
        - agent-n8n/starterpaket.qmd

format:
  html:
    toc: true
    # Theme-Stack: cosmo als Bootstrap-Basis, book-theme.scss zieht den
    # Plattform-Mirror-Look (Geist, Cream-Paper, Ink, Ochre, Terracotta) durch.
    # Schwester-Datei zu slides/redesign/variant-a-pure.scss — gleiche DNA für
    # Buch und Slides.
    theme:
      - cosmo
      - book-theme.scss
    code-copy: true
    # github (light) statt github-dark — passt zum Cream-Paper-Hintergrund.
    highlight-style: github
    code-overflow: wrap
    author-meta: "Jan Kirenz"
    callout-appearance: simple
