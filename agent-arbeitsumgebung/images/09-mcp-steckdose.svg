<svg xmlns='http://www.w3.org/2000/svg' font-family='Helvetica, Arial, sans-serif' viewBox='0 0 640 300' role='img' aria-label='Schema: links der Agent im Ordner kundenanfragen, in der Mitte eine Steckdose mit der Aufschrift MCP, rechts drei MCP-Server. Kalender-Server mit termine_lesen (liest) und termin_anlegen (ändert), Ablage-Server mit dateien_suchen (liest), Ticket-Server mit ticket_anlegen (ändert).' ><defs><marker id='pf' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5b6170'/></marker></defs><rect x='16' y='96' width='170' height='108' rx='10' fill='#f4f2ed' stroke='#dcd9d2' stroke-width='1.5'/><text x='101' y='126' font-size='15' font-weight='bold' fill='#1f2430' text-anchor='middle'>Agent</text><text x='101' y='150' font-size='12' font-weight='normal' fill='#5b6170' text-anchor='middle'>arbeitet im Ordner</text><text x='101' y='172' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='middle' font-family='ui-monospace, Menlo, monospace'>kundenanfragen/</text><line x1='188' y1='150' x2='252' y2='150' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)'/><circle cx='286' cy='150' r='30' fill='#f4f2ed' stroke='#23417a' stroke-width='2'/><circle cx='276' cy='150' r='4.5' fill='#23417a'/><circle cx='296' cy='150' r='4.5' fill='#23417a'/><text x='286' y='202' font-size='14' font-weight='bold' fill='#23417a' text-anchor='middle'>MCP</text><text x='286' y='220' font-size='11' font-weight='normal' fill='#5b6170' text-anchor='middle'>genormter Anschluss</text><line x1='316' y1='150' x2='390' y2='55.0' stroke='#23417a' stroke-width='1.5'/><rect x='392' y='18' width='230' height='74' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><text x='406' y='40' font-size='13' font-weight='bold' fill='#1f2430' text-anchor='start'>Kalender-Server</text><text x='406' y='62' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-family='ui-monospace, Menlo, monospace'>termine_lesen</text><text x='608' y='62' font-size='11' font-weight='bold' fill='#5b6170' text-anchor='end'>liest</text><text x='406' y='82' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-family='ui-monospace, Menlo, monospace'>termin_anlegen</text><text x='608' y='82' font-size='11' font-weight='bold' fill='#c8962f' text-anchor='end'>ändert</text><line x1='316' y1='150' x2='390' y2='135.0' stroke='#23417a' stroke-width='1.5'/><rect x='392' y='108' width='230' height='54' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><text x='406' y='130' font-size='13' font-weight='bold' fill='#1f2430' text-anchor='start'>Ablage-Server</text><text x='406' y='152' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-family='ui-monospace, Menlo, monospace'>dateien_suchen</text><text x='608' y='152' font-size='11' font-weight='bold' fill='#5b6170' text-anchor='end'>liest</text><line x1='316' y1='150' x2='390' y2='205.0' stroke='#23417a' stroke-width='1.5'/><rect x='392' y='178' width='230' height='54' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><text x='406' y='200' font-size='13' font-weight='bold' fill='#1f2430' text-anchor='start'>Ticket-Server</text><text x='406' y='222' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-family='ui-monospace, Menlo, monospace'>ticket_anlegen</text><text x='608' y='222' font-size='11' font-weight='bold' fill='#c8962f' text-anchor='end'>ändert</text><text x='392' y='256' font-size='11' font-weight='normal' fill='#5b6170' text-anchor='start'>MCP-Server stellen Werkzeuge bereit.</text></svg>
