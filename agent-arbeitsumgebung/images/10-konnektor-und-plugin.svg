<svg xmlns='http://www.w3.org/2000/svg' font-family='Helvetica, Arial, sans-serif' viewBox='0 0 640 236' role='img' aria-label='Schema in zwei Teilen. Links Konnektor: Agent, fertige Verbindung, E-Mail-Dienst mit mails_lesen (liest) und mail_senden (sendet), Anmeldung im Browser. Rechts Plugin: ein Paket Team-Plugin mit Schalter ein, darin ein Skill, Regeln, ein MCP-Server für die Ablage und ein Automatismus.' ><defs><marker id='pf' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5b6170'/></marker></defs><text x='20' y='26' font-size='15' font-weight='bold' fill='#23417a' text-anchor='start'>Konnektor</text><rect x='20' y='44' width='120' height='64' rx='10' fill='#f4f2ed' stroke='#dcd9d2' stroke-width='1.5'/><text x='80' y='81' font-size='14' font-weight='bold' fill='#1f2430' text-anchor='middle'>Agent</text><line x1='142' y1='76' x2='186' y2='76' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)'/><rect x='190' y='44' width='110' height='64' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><text x='245' y='70' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='middle'>fertige</text><text x='245' y='88' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='middle'>Verbindung</text><line x1='302' y1='76' x2='346' y2='76' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)'/><rect x='20' y='128' width='280' height='92' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><text x='34' y='150' font-size='13' font-weight='bold' fill='#1f2430' text-anchor='start'>E-Mail-Dienst</text><text x='34' y='172' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-family='ui-monospace, Menlo, monospace'>mails_lesen</text><text x='286' y='172' font-size='11' font-weight='bold' fill='#5b6170' text-anchor='end'>liest</text><text x='34' y='192' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-fami