<svg xmlns='http://www.w3.org/2000/svg' font-family='Helvetica, Arial, sans-serif' viewBox='0 0 640 320' role='img' aria-label='Schema: links der Agent im Ordner kundenanfragen, in der Mitte eine Zugangskarte mit der Aufschrift MCP, rechts vier Türen zu anderen Systemen. Offen, weil die Karte dafür freigeschaltet ist: Kalender-Server mit termine_lesen (liest) und termin_anlegen (ändert), Ablage-Server mit dateien_suchen (liest), Ticket-Server mit ticket_anlegen (ändert). Verschlossen: Buchhaltung, nicht freigeschaltet.' ><defs><marker id='pf' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#5b6170'/></marker></defs><rect x='16' y='106' width='170' height='108' rx='10' fill='#f4f2ed' stroke='#dcd9d2' stroke-width='1.5'/><text x='101' y='136' font-size='15' font-weight='bold' fill='#1f2430' text-anchor='middle'>Agent</text><text x='101' y='160' font-size='12' font-weight='normal' fill='#5b6170' text-anchor='middle'>arbeitet im Ordner</text><text x='101' y='182' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='middle' font-family='ui-monospace, Menlo, monospace'>kundenanfragen/</text><line x1='188' y1='160' x2='224' y2='160' stroke='#5b6170' stroke-width='1.5' marker-end='url(#pf)'/><rect x='228' y='130' width='100' height='60' rx='8' fill='#f4f2ed' stroke='#23417a' stroke-width='2'/><rect x='238' y='152.0' width='18' height='15' rx='3' fill='#23417a' fill-opacity='0.85'/><line x1='238' y1='160.0' x2='256' y2='160.0' stroke='#f4f2ed' stroke-width='1'/><line x1='247' y1='152.0' x2='247' y2='167.0' stroke='#f4f2ed' stroke-width='1'/><text x='290.0' y='165.0' font-size='15' font-weight='bold' fill='#23417a' text-anchor='middle'>MCP</text><text x='278' y='214' font-size='11' font-weight='normal' fill='#5b6170' text-anchor='middle'>Zugangskarte für ein</text><text x='278' y='229' font-size='11' font-weight='normal' fill='#5b6170' text-anchor='middle'>genormtes Schließsystem</text><line x1='330' y1='160' x2='390' y2='51.0' stroke='#23417a' stroke-width='1.5'/><rect x='392' y='14' width='230' height='74' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><rect x='404' y='36.0' width='18' height='30' rx='1.5' fill='#f4f2ed' stroke='#5b6170' stroke-width='1.2'/><polygon points='404,36.0 415,41.0 415,71.0 404,66.0' fill='#23417a' fill-opacity='0.2' stroke='#23417a' stroke-width='1.4' stroke-linejoin='round'/><text x='434' y='36' font-size='13' font-weight='bold' fill='#1f2430' text-anchor='start'>Kalender-Server</text><text x='434' y='58' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-family='ui-monospace, Menlo, monospace'>termine_lesen</text><text x='608' y='58' font-size='11' font-weight='bold' fill='#5b6170' text-anchor='end'>liest</text><text x='434' y='78' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-family='ui-monospace, Menlo, monospace'>termin_anlegen</text><text x='608' y='78' font-size='11' font-weight='bold' fill='#c8962f' text-anchor='end'>ändert</text><line x1='330' y1='160' x2='390' y2='127.0' stroke='#23417a' stroke-width='1.5'/><rect x='392' y='100' width='230' height='54' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><rect x='404' y='112.0' width='18' height='30' rx='1.5' fill='#f4f2ed' stroke='#5b6170' stroke-width='1.2'/><polygon points='404,112.0 415,117.0 415,147.0 404,142.0' fill='#23417a' fill-opacity='0.2' stroke='#23417a' stroke-width='1.4' stroke-linejoin='round'/><text x='434' y='122' font-size='13' font-weight='bold' fill='#1f2430' text-anchor='start'>Ablage-Server</text><text x='434' y='144' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-family='ui-monospace, Menlo, monospace'>dateien_suchen</text><text x='608' y='144' font-size='11' font-weight='bold' fill='#5b6170' text-anchor='end'>liest</text><line x1='330' y1='160' x2='390' y2='193.0' stroke='#23417a' stroke-width='1.5'/><rect x='392' y='166' width='230' height='54' rx='10' fill='#fbfaf7' stroke='#dcd9d2' stroke-width='1.5'/><rect x='404' y='178.0' width='18' height='30' rx='1.5' fill='#f4f2ed' stroke='#5b6170' stroke-width='1.2'/><polygon points='404,178.0 415,183.0 415,213.0 404,208.0' fill='#23417a' fill-opacity='0.2' stroke='#23417a' stroke-width='1.4' stroke-linejoin='round'/><text x='434' y='188' font-size='13' font-weight='bold' fill='#1f2430' text-anchor='start'>Ticket-Server</text><text x='434' y='210' font-size='12' font-weight='normal' fill='#1f2430' text-anchor='start' font-family='ui-monospace, Menlo, monospace'>ticket_anlegen</text><text x='608' y='210' font-size='11' font-weight='bold' fill='#c8962f' text-anchor='end'>ändert</text><line x1='330' y1='160' x2='390' y2='258.0' stroke='#5b6170' stroke-width='1.5' stroke-dasharray='5 4'/><rect x='392' y='232' width='230' height='52' rx='10' fill='#f4f2ed' stroke='#dcd9d2' stroke-width='1.5' stroke-dasharray='6 5'/><rect x='404' y='243.0' width='18' height='30' rx='1.5' fill='#dcd9d2' stroke='#5b6170' stroke-width='1.2'/><path d='M410.5,257.0 v-3 a2.5,2.5 0 0 1 5,0 v3' fill='none' stroke='#5b6170' stroke-width='1.3'/><rect x='409' y='257.0' width='8' height='6.5' rx='1' fill='#5b6170'/><text x='434' y='254' font-size='13' font-weight='bold' fill='#5b6170' text-anchor='start'>Buchhaltung</text><text x='434' y='272' font-size='11' font-weight='normal' fill='#5b6170' text-anchor='start'>nicht freigeschaltet: Tür bleibt zu</text><text x='622' y='306' font-size='11' font-weight='normal' fill='#5b6170' text-anchor='end'>Hinter jeder offenen Tür: ein MCP-Server mit Werkzeugen.</text></svg>