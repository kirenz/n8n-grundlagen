<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker></defs><rect width="900" height="310" fill="#ffffff"/><text x="450" y="34" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="middle">Was n8n ist und was nicht</text><rect x="30" y="60" width="410" height="230" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><rect x="460" y="60" width="410" height="230" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="235" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">n8n ist die Orchestrierung</text><text x="665" y="92" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">n8n ist nicht</text><text x="55" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">✓</text><text x="80" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="start">verbindet Werkzeuge zu einem Ablauf</text><text x="485" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">✗</text><text x="510" y="135" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="start">kein vollwertiger Code-Editor</text><text x="55" y="175" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">✓</text><text x="80" y="175" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="start">steuert die Reihenfolge der Schritte</text><text x="485" y="175" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">✗</text><text x="510" y="175" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="start">kein Daten-Warehouse (Datenlager)</text><text x="55" y="215" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">✓</text><text x="80" y="215" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="start">bindet KI-Dienste als Baustein ein</text><text x="485" y="215" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">✗</text><text x="510" y="215" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="start">kein eigenes KI-Modell</text><text x="55" y="255" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">✓</text><text x="80" y="255" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="start">protokolliert jeden Durchlauf</text><text x="485" y="255" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">✗</text><text x="510" y="255" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#18181b" text-anchor="start">kein Ersatz für CRM oder Buchhaltung</text></svg>