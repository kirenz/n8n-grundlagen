<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450" y="34" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="middle">Was sich für das Team ändert</text><text x="250" y="72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#52525b" text-anchor="middle">Von Hand</text><text x="650" y="72" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0052ff" text-anchor="middle">Mit n8n</text><text x="30" y="122" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#52525b" text-anchor="start">Eingang bemerken</text><rect x="150" y="98" width="320" height="40" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="165" y="123" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">jemand prüft irgendwann das Postfach</text><rect x="500" y="98" width="370" height="40" rx="8" fill="#e8efff" stroke="#e8efff" stroke-width="1.5"/><text x="515" y="123" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#18181b" text-anchor="start">Trigger erkennt jede Nachricht sofort</text><text x="30" y="178" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#52525b" text-anchor="start">Bestätigung</text><rect x="150" y="154" width="320" height="40" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="165" y="179" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">wird von Hand getippt</text><rect x="500" y="154" width="370" height="40" rx="8" fill="#e8efff" stroke="#e8efff" stroke-width="1.5"/><text x="515" y="179" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#18181b" text-anchor="start">geht automatisch raus</text><text x="30" y="234" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#52525b" text-anchor="start">Tabelle</text><rect x="150" y="210" width="320" height="40" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="165" y="235" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Eintrag von Hand übertragen</text><rect x="500" y="210" width="370" height="40" rx="8" fill="#e8efff" stroke="#e8efff" stroke-width="1.5"/><text x="515" y="235" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#18181b" text-anchor="start">Zeile entsteht automatisch</text><text x="30" y="290" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#52525b" text-anchor="start">Ergebnis</text><rect x="150" y="266" width="320" height="40" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="165" y="291" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">abhängig von Tagesform</text><rect x="500" y="266" width="370" height="40" rx="8" fill="#e8efff" stroke="#e8efff" stroke-width="1.5"/><text x="515" y="291" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#18181b" text-anchor="start">bei jeder Nachricht gleich</text></svg>