<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 305" width="900" height="305"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker></defs><rect width="900" height="305" fill="#ffffff"/><text x="450" y="32" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="middle">Die 14 Testtage für das Bauen nutzen</text><rect x="30" y="110" width="230" height="44" rx="8" fill="#f4f4f5" stroke="#f4f4f5" stroke-width="1.5"/><text x="145" y="137" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#52525b" text-anchor="middle">Kurs lesen: Start, Plattform, BPMN</text><rect x="270" y="110" width="420" height="44" rx="8" fill="#0052ff" stroke="#0052ff" stroke-width="1.5"/><text x="480" y="137" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">14 Tage Testphase: bauen und testen</text><rect x="700" y="110" width="170" height="44" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="785" y="137" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#52525b" text-anchor="middle">90 Tage nur Download</text><line x1="270" y1="92" x2="270" y2="172" stroke="#18181b" stroke-width="2"/><text x="270" y="82" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#18181b" text-anchor="middle">Tag 1</text><text x="270" y="192" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="middle">registrieren</text><line x1="690" y1="92" x2="690" y2="172" stroke="#18181b" stroke-width="2"/><text x="690" y="82" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#18181b" text-anchor="middle">Tag 14</text><text x="690" y="192" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="middle">Workflows sichern</text><line x1="870" y1="92" x2="870" y2="172" stroke="#18181b" stroke-width="2"/><text x="870" y="82" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#18181b" text-anchor="end">nach 90 Tagen</text><text x="870" y="192" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="end">endgültig gelöscht</text><rect x="30" y="230" width="840" height="60" rx="10" fill="#e8efff" stroke="#e8efff" stroke-width="1.5"/><text x="50" y="256" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#18181b" text-anchor="start">Testphase von n8n Cloud: alle Pro-Funktionen, bis zu 1.000 Ausführungen, keine Kreditkarte.</text><text x="50" y="278" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Endet automatisch ohne Kosten. Erst registrieren, wenn die Lektion zum ersten Workflow beginnt.</text></svg>