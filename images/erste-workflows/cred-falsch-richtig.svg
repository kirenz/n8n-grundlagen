<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker></defs><rect width="900" height="270" fill="#ffffff"/><text x="450" y="30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="middle">Zugangsdaten: so nicht, so richtig</text><rect x="30" y="55" width="410" height="200" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><rect x="460" y="55" width="410" height="200" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="235" y="86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#dc2626" text-anchor="middle">So nicht</text><text x="665" y="86" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">So richtig</text><text x="52" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">✗</text><text x="76" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Hauptpasswort des Team-Postfachs</text><text x="482" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">✓</text><text x="506" y="124" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">App-Passwort oder OAuth statt Hauptpasswort</text><text x="52" y="160" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">✗</text><text x="76" y="160" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">steht direkt im Workflow</text><text x="482" y="160" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">✓</text><text x="506" y="160" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">liegt als Credential getrennt vom Workflow</text><text x="52" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">✗</text><text x="76" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Token mit Vollzugriff auf Slack</text><text x="482" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">✓</text><text x="506" y="196" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Token nur mit den nötigen Rechten</text><text x="52" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">✗</text><text x="76" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Export enthält das Geheimnis</text><text x="482" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#16a34a" text-anchor="start">✓</text><text x="506" y="232" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Export enthält nur den Namen des Credentials</text></svg>