<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker></defs><rect width="900" height="290" fill="#ffffff"/><text x="450" y="30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="middle">Drei Arten von Zugangsdaten</text><rect x="30" y="55" width="260" height="190" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="50" y="88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="start">App-Passwort</text><text x="50" y="110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="start">für Mail-Postfächer (IMAP, SMTP)</text><circle cx="56" cy="146" r="4" fill="#0052ff"/><text x="68" y="151" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">eigenes Passwort nur für n8n</text><circle cx="56" cy="176" r="4" fill="#0052ff"/><text x="68" y="181" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">einzeln widerrufbar</text><circle cx="56" cy="206" r="4" fill="#0052ff"/><text x="68" y="211" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Hauptpasswort bleibt geheim</text><rect x="320" y="55" width="260" height="190" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="340" y="88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="start">OAuth</text><text x="340" y="110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="start">für Gmail, Microsoft 365 und viele Dienste</text><circle cx="346" cy="146" r="4" fill="#0052ff"/><text x="358" y="151" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Anmeldung beim Anbieter</text><circle cx="346" cy="176" r="4" fill="#0052ff"/><text x="358" y="181" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">Rechte beim Anbieter sichtbar</text><circle cx="346" cy="206" r="4" fill="#0052ff"/><text x="358" y="211" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">jederzeit widerrufbar</text><rect x="610" y="55" width="260" height="190" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="630" y="88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="start">API-Schlüssel</text><text x="630" y="110" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="start">für Dienste wie Google Gemini</text><circle cx="636" cy="146" r="4" fill="#0052ff"/><text x="648" y="151" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">vom Anbieter erzeugt</text><circle cx="636" cy="176" r="4" fill="#0052ff"/><text x="648" y="181" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">wie ein Passwort behandeln</text><circle cx="636" cy="206" r="4" fill="#0052ff"/><text x="648" y="211" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#18181b" text-anchor="start">bei Verlust sofort löschen</text><text x="450" y="272" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#18181b" text-anchor="middle">Für alle drei gilt: nur so viele Rechte, wie der Workflow wirklich braucht.</text></svg>