<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52525b"/></marker></defs><rect width="900" height="280" fill="#ffffff"/><text x="450" y="30" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18181b" text-anchor="middle">Credentials liegen getrennt vom Workflow</text><rect x="30" y="60" width="300" height="170" rx="12" fill="#e8efff" stroke="#0052ff" stroke-width="2"/><text x="180" y="90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0052ff" text-anchor="middle">Workflow</text><rect x="55" y="110" width="250" height="44" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="70" y="137" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#18181b" text-anchor="start">Knoten: Google Gemini Chat Model</text><text x="70" y="182" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="start">kennt nur den Namen:</text><text x="70" y="204" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="start">„Google Gemini(PaLM) Api account“</text><rect x="370" y="60" width="230" height="170" rx="12" fill="#ffffff" stroke="#18181b" stroke-width="2"/><text x="485" y="90" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Credential</text><text x="485" y="122" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="middle">API-Schlüssel, verschlüsselt</text><text x="485" y="142" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="middle">in n8n gespeichert</text><text x="485" y="180" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">für mehrere Knoten</text><text x="485" y="200" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#18181b" text-anchor="middle">nutzbar</text><rect x="640" y="105" width="230" height="80" rx="12" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/><text x="755" y="140" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Dienst</text><text x="755" y="162" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52525b" text-anchor="middle">z. B. Google Gemini</text><line x1="330" y1="145" x2="368" y2="145" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><line x1="600" y1="145" x2="638" y2="145" stroke="#52525b" stroke-width="2" marker-end="url(#a)"/><text x="619" y="200" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#52525b" text-anchor="middle">meldet sich an</text><text x="450" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#52525b" text-anchor="middle">Wer den Workflow exportiert oder teilt, gibt den Schlüssel nicht mit weiter.</text></svg>