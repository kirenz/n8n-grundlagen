# n8n Self-Host Stack: n8n + Postgres
# Läuft hinter dem zentralen sales-voice-caddy-1 Reverse Proxy auf dem Hetzner-Server.
# n8n und Postgres hängen im internen Netz (Postgres-Verbindung) plus
# sales-voice_default (damit der Caddy n8n erreicht).
# Konfiguration über .env (siehe .env.example).

name: n8n-prod

services:
  postgres:
    image: postgres:18-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER}
      POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Datenbank ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_NON_ROOT_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}

      # --- Sicherheit ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_DISABLED: "false"
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_SECURE_COOKIE: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"

      # --- URL und Webhooks ---
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/

      # --- Trust Proxy (zentraler Caddy davor) ---
      N8N_PROXY_HOPS: 1

      # --- Sonstiges ---
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      TZ: ${TIMEZONE:-Europe/Berlin}
      N8N_LOG_LEVEL: info
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - internal      # für Postgres-Verbindung
      - caddy-net     # für den zentralen Caddy

volumes:
  postgres-data:
  n8n-data:

networks:
  internal:
    driver: bridge
  caddy-net:
    # Existierendes Netz vom zentralen Caddy (sales-voice-caddy-1)
    external: true
    name: sales-voice_default
